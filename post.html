<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #cbd5e1; line-height: 1.8; }
        .content-area { font-size: 1.3rem; text-align: justify; } /* تكبير الخط */
        .ad-slot { background: rgba(30, 41, 59, 0.5); border: 1px dashed #334155; margin: 25px 0; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; border-radius: 15px; }
    </style>
</head>
<body class="p-5 md:p-10">
    <div class="max-w-3xl mx-auto">
        <a href="index.html" class="text-blue-500 font-bold mb-8 inline-block">← العودة للرئيسية</a>
        
        <h1 id="title" class="text-3xl md:text-5xl font-black text-white mb-6 leading-tight"></h1>
        <img id="image" class="w-full h-auto rounded-3xl mb-8 shadow-2xl border border-slate-800 hidden">

        <div id="ad-top" class="ad-slot"></div>

        <div id="content" class="content-area space-y-6"></div>

        <div id="ad-bottom" class="ad-slot"></div>

        <div id="faq-section" class="mt-12 border-t border-slate-800 pt-8">
            <h2 class="text-2xl font-black text-blue-500 mb-6 italic underline">أسئلة تهمك (FAQ)</h2>
            <div id="faq-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        async function load() {
            const file = new URLSearchParams(window.location.search).get('file');
            const res = await fetch(`content/posts/${file}`);
            const raw = await res.text();
            const parts = raw.split('---');
            const meta = JSON.parse('{' + parts[1].split('\n').filter(l=>l.includes(':')).map(l => {
                let [k, ...v] = l.split(':');
                return `"${k.trim()}": "${v.join(':').trim().replace(/"/g, '')}"`;
            }).join(',') + '}');

            document.getElementById('title').innerText = meta.title;
            if(meta.image && meta.image !== 'undefined') {
                const img = document.getElementById('image');
                img.src = meta.image; img.classList.remove('hidden');
            }

            // فك كود الإعلانات وحقنه في أماكنه
            if(meta.ads) {
                const ads = decodeURIComponent(escape(atob(meta.ads)));
                document.getElementById('ad-top').innerHTML = ads;
                document.getElementById('ad-bottom').innerHTML = ads;
            }

            document.getElementById('content').innerHTML = parts[2].trim().replace(/\n/g, '<br>');

            // عرض الأسئلة
            try {
                const faqs = JSON.parse(parts[1].match(/faq: (\[.*\])/)[1]);
                faqs.forEach(f => {
                    document.getElementById('faq-list').innerHTML += `
                        <div class="bg-slate-900/50 p-5 rounded-2xl border-r-4 border-blue-600">
                            <h3 class="font-black text-blue-400 mb-2">${f.q}</h3>
                            <p class="text-slate-400 text-sm">${f.a}</p>
                        </div>`;
                });
            } catch(e){}
        }
        load();
    </script>
</body>
</html>
