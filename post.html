<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title id="page-title">تحميل...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        .prose img { border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #1e293b; margin: 2rem auto; }
        .prose h2 { color: #3b82f6; font-weight: 900; font-size: 2.25rem; margin-top: 3rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-4xl mx-auto px-6 py-20">
        <header class="mb-16">
            <div id="post-category" class="text-blue-500 font-black uppercase text-sm tracking-widest mb-4 text-center"></div>
            <h1 id="post-title" class="text-4xl md:text-6xl font-black text-white text-center leading-tight"></h1>
            <p id="post-meta" class="text-slate-400 text-xl text-center mt-6 italic"></p>
        </header>

        <img id="post-main-img" class="w-full h-[500px] object-cover rounded-[3rem] shadow-2xl mb-16 border border-slate-800">

        <div id="post-content" class="prose prose-invert prose-blue max-w-none text-lg leading-relaxed">
            </div>

        <section id="faq-wrapper" class="mt-20 border-t border-slate-800 pt-10">
            <h2 class="text-3xl font-bold mb-10 text-cyan-400">الأسئلة الشائعة (FAQ)</h2>
            <div id="faq-list" class="space-y-6"></div>
        </section>
    </div>

    <script type="application/ld+json" id="json-ld"></script>

    <script>
        async function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const response = await fetch(`./content/posts/${fileName}`);
            const raw = await response.text();

            const parts = raw.split('---');
            const meta = jsyaml.load(parts[1]);
            const body = parts[2];

            document.title = meta.title;
            document.getElementById('post-title').innerText = meta.title;
            document.getElementById('post-category').innerText = meta.category;
            document.getElementById('post-meta').innerText = meta.meta;
            document.getElementById('post-main-img').src = meta.image;
            document.getElementById('post-content').innerHTML = marked.parse(body);

            // بناء الـ FAQ والـ JSON-LD
            if (meta.faq) {
                const faqContainer = document.getElementById('faq-list');
                const schemaFAQ = { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [] };
                
                meta.faq.forEach(item => {
                    faqContainer.innerHTML += `
                        <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-800">
                            <h4 class="font-bold text-white mb-2 underline">🔹 ${item.q}</h4>
                            <p class="text-slate-400">${item.a}</p>
                        </div>`;
                    schemaFAQ.mainEntity.push({ "@type": "Question", "name": item.q, "acceptedAnswer": { "@type": "Answer", "text": item.a } });
                });
                document.getElementById('json-ld').text = JSON.stringify(schemaFAQ);
            }
        }
        loadPost();
    </script>
</body>
</html>
