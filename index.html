<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Intelligence | بوابة استخبارات 2026</title>
    <meta name="description" content="تحليلات حصرية للعقارات، الكريبتو، والاقتصاد العالمي.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; }
        .post-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
    </style>
</head>
<body class="text-slate-200">
    <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800 p-5">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">MATRIX A</h1>
            <div id="category-menu" class="flex gap-6 text-sm font-bold">
                <button onclick="filterPosts('all')" class="hover:text-blue-400">الكل</button>
                <button onclick="filterPosts('Crypto')" class="hover:text-blue-400">كريبتو</button>
                <button onclick="filterPosts('Real Estate')" class="hover:text-blue-400 font-bold">عقارات</button>
            </div>
        </div>
    </nav>

    <header class="py-20 text-center bg-gradient-to-b from-slate-900 to-transparent">
        <h2 class="text-5xl md:text-7xl font-black text-white mb-6 tracking-tighter">تقارير الغزو الاقتصادي</h2>
        <p class="text-slate-400 text-xl max-w-2xl mx-auto">بيانات دقيقة مستخرجة بذكاء اصطناعي فائق السرعة.</p>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
        const REPO_OWNER = "medo7788"; // ضع اسم حسابك هنا
        const REPO_NAME = "Archive-"; // ضع اسم المستودع هنا

        async function fetchPosts() {
            const grid = document.getElementById('posts-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/posts`);
                const files = await response.json();
                
                grid.innerHTML = '';
                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        const contentRes = await fetch(file.download_url);
                        const text = await contentRes.text();
                        const meta = jsyaml.load(text.split('---')[1]);
                        
                        grid.innerHTML += `
                            <article class="post-card bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden transition-all duration-300 cursor-pointer" onclick="location.href='post.html?file=${file.name}'">
                                <img src="${meta.image || 'https://via.placeholder.com/800x400'}" class="w-full h-48 object-cover">
                                <div class="p-6">
                                    <span class="text-xs font-bold text-blue-400 uppercase">${meta.category}</span>
                                    <h3 class="text-2xl font-bold text-white mt-2">${meta.title}</h3>
                                    <p class="text-slate-400 mt-3 text-sm line-clamp-3">${meta.meta}</p>
                                    <div class="mt-6 text-xs text-slate-500 font-bold">${meta.date}</div>
                                </div>
                            </article>`;
                    }
                }
            } catch (e) { grid.innerHTML = "خطأ في تحميل البيانات.. تأكد من الإعدادات."; }
        }
        window.onload = fetchPosts;
    </script>
</body>
</html>
