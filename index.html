<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medo7788 - مدونة المحتوى المتنوع</title>
<meta name="description" content="مدونة متخصصة في المحتوى الرياضي والتقني والمحتوى العام. اقرأ أحدث المقالات والتحليلات المتعمقة.">
<meta name="keywords" content="مدونة, محتوى, رياضة, تقنية, تحليلات, مقالات">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Medo7788 - مدونة المحتوى المتنوع">
<meta property="og:description" content="مدونة متخصصة في المحتوى الرياضي والتقني والعام">
<meta property="og:url" content="https://medo7788.github.io/Archive-/">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#0f172a;color:#e2e8f0;}
header{background:linear-gradient(135deg,rgba(30,64,175,0.1),rgba(15,23,42,0.8));backdrop-filter:blur(12px);border-bottom:1px solid rgba(59,130,246,0.1);position:sticky;top:0;z-index:50;}
.hero{background:linear-gradient(135deg,#1e40af 0%,#0f172a 100%);padding:4rem 1rem;text-align:center;}
.hero h1{font-size:3rem;font-weight:900;margin-bottom:1rem;background:linear-gradient(135deg,#fff,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{font-size:1.25rem;color:#cbd5e1;margin-bottom:2rem;}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem;margin:3rem 0;}
.post-card{background:rgba(30,41,59,0.5);border:1px solid rgba(59,130,246,0.2);border-radius:0.75rem;padding:1.5rem;transition:all 0.3s;}
.post-card:hover{border-color:#3b82f6;box-shadow:0 10px 30px rgba(59,130,246,0.2);transform:translateY(-5px);}
.post-card h3{font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;color:#fff;}
.post-card p{font-size:0.95rem;color:#cbd5e1;margin-bottom:1rem;}
.post-card .meta{display:flex;gap:1rem;font-size:0.85rem;color:#94a3b8;margin-bottom:1rem;}
.post-card .tag{display:inline-block;background:#3b82f6;color:white;padding:0.3rem 0.6rem;border-radius:0.25rem;font-size:0.8rem;}
.read-more{color:#3b82f6;font-weight:600;text-decoration:none;transition:all 0.3s;}
.read-more:hover{color:#fff;}
.no-posts{text-align:center;padding:3rem;color:#94a3b8;}
</style>
</head>
<body>
<header>
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
<h1 class="text-3xl font-black text-blue-400">📝 Medo7788</h1>
<nav class="flex gap-6">
<a href="/" class="text-sm text-gray-400 hover:text-blue-400 transition">الرئيسية</a>
<a href="/posts" class="text-sm text-gray-400 hover:text-blue-400 transition">المقالات</a>
<a href="#" class="text-sm text-gray-400 hover:text-blue-400 transition">عني</a>
</nav>
</div>
</header>

<div class="hero">
<div class="max-w-6xl mx-auto">
<h1>أهلاً بك في مدونتي</h1>
<p>مدونة متخصصة في المحتوى الرياضي والتقني والمحتوى العام</p>
<p style="font-size:0.95rem;color:#94a3b8;margin-bottom:0;">احدث المقالات والتحليلات المتعمقة</p>
</div>
</div>

<main class="max-w-6xl mx-auto px-4 py-12">
<h2 class="text-3xl font-bold text-blue-400 mb-8">📚 أحدث المقالات</h2>

<div id="posts-container" class="posts-grid">
<div class="no-posts">جاري تحميل المقالات...</div>
</div>
</main>

<footer style="background:rgba(15,23,42,0.8);border-top:1px solid rgba(59,130,246,0.1);padding:2rem;text-align:center;color:#94a3b8;margin-top:3rem;">
<p>&copy; 2024 Medo7788 Blog. جميع الحقوق محفوظة.</p>
<p style="font-size:0.85rem;margin-top:1rem;">مدونة متخصصة في المحتوى الرياضي والتقني</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
async function loadPosts(){
const container=document.getElementById('posts-container');
try{
const response=await fetch('/posts');
const text=await response.text();
const files=text.match(/href="([^"]+\.md)"/g)||[];

if(files.length===0){
container.innerHTML='<div class="no-posts">لا توجد مقالات حالياً</div>';
return;
}

container.innerHTML='';
let count=0;

for(let fileMatch of files){
const file=fileMatch.match(/href="([^"]+)"/)[1];
try{
const postRes=await fetch(`/posts/${file}`);
const markdown=await postRes.text();
const match=markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);

if(!match)continue;

const fm={};
match[1].split('\n').forEach(line=>{
const [k,...v]=line.split(':');
if(k){fm[k.trim()]=v.join(':').trim().replace(/^["']|["']$/g,'');}
});

const card=document.createElement('div');
card.className='post-card';
card.innerHTML=`
<span class="post-card .tag">${fm.category||'عام'}</span>
<h3>${fm.title||'بدون عنوان'}</h3>
<p>${fm.description||'بدون وصف'}</p>
<div class="meta">
<span>📅 ${fm.datePublished||'اليوم'}</span>
<span>⏱️ ${Math.ceil((match[2].split(/\s+/).length)/250)||'5'} دقائق</span>
</div>
<a href="post.html?file=${file}" class="read-more">اقرأ المقال →</a>
`;
container.appendChild(card);
count++;
}catch(e){}
}

if(count===0){
container.innerHTML='<div class="no-posts">لا توجد مقالات حالياً</div>';
}
}catch(e){
container.innerHTML='<div class="no-posts">خطأ في تحميل المقالات</div>';
}
}

loadPosts();
</script>
</body>
</html>
